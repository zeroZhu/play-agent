[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-bot-mumu"
version = "0.1.0"
description = "Python game auto-farm bot for Android emulators (MuMu first)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "opencv-python>=4.10",
  "numpy>=1.26",
  "python-dotenv>=1.0",
]

[project.scripts]
ymjh-bot = "ymjh_bot.main:main"
ymjh-build-release = "ymjh_bot.build_release:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyinstaller==6.22.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["integration: tests requiring real adb/emulator"]
